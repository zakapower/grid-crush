<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grid Crush</title>
  <link rel="stylesheet" href="style.css?v=1.5.1" />
</head>
<body>
  <div id="menu" class="menu">
    <div class="menu-bg" aria-hidden="true">
      <span class="menu-bg-block" style="--c:#4aa3ff; --x:8%; --s:22px; --d:0s; --t:18s; --o:0.22"></span>
      <span class="menu-bg-block" style="--c:#57d38c; --x:22%; --s:16px; --d:-3s; --t:22s; --o:0.18"></span>
      <span class="menu-bg-block" style="--c:#ffb454; --x:38%; --s:28px; --d:-7s; --t:16s; --o:0.2"></span>
      <span class="menu-bg-block" style="--c:#ff6b8a; --x:55%; --s:18px; --d:-1s; --t:20s; --o:0.2"></span>
      <span class="menu-bg-block" style="--c:#b388ff; --x:72%; --s:24px; --d:-5s; --t:19s; --o:0.18"></span>
      <span class="menu-bg-block" style="--c:#35d0d6; --x:88%; --s:14px; --d:-9s; --t:24s; --o:0.22"></span>
      <span class="menu-bg-block" style="--c:#ff8f5a; --x:14%; --s:20px; --d:-12s; --t:21s; --o:0.16"></span>
      <span class="menu-bg-block" style="--c:#4aa3ff; --x:46%; --s:12px; --d:-4s; --t:17s; --o:0.2"></span>
      <span class="menu-bg-block" style="--c:#57d38c; --x:64%; --s:26px; --d:-8s; --t:23s; --o:0.15"></span>
      <span class="menu-bg-block" style="--c:#ffb454; --x:80%; --s:18px; --d:-2s; --t:15s; --o:0.18"></span>
      <span class="menu-bg-block menu-bg-block--drift" style="--c:#b388ff; --x:30%; --s:34px; --d:-6s; --t:26s; --o:0.12"></span>
      <span class="menu-bg-block menu-bg-block--drift" style="--c:#ff6b8a; --x:70%; --s:30px; --d:-11s; --t:28s; --o:0.12"></span>
    </div>

    <button type="button" id="achievements-btn" class="icon-btn icon-btn--corner-left" aria-label="Достижения" title="Достижения">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
    </button>

    <button type="button" id="settings-btn" class="icon-btn icon-btn--corner" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <div class="menu-inner">
      <header class="menu-hero">
        <h1 class="menu-title">Grid Crush</h1>
        <div class="menu-mini-grid" aria-hidden="true">
          <span class="menu-block" style="--c:#4aa3ff"></span>
          <span class="menu-block" style="--c:#57d38c"></span>
          <span class="menu-block" style="--c:#ffb454"></span>
          <span class="menu-block" style="--c:#ff6b8a"></span>
          <span class="menu-block" style="--c:#b388ff"></span>
          <span class="menu-block" style="--c:#ff8f5a"></span>
        </div>
        <p class="menu-record">Рекорд · <span data-best="classic">—</span></p>
      </header>

      <div class="menu-actions">
        <button type="button" id="play-btn" class="play-btn">Играть</button>
        <button type="button" id="daily-btn" class="daily-btn">
          <span class="daily-btn-title">На сегодня</span>
          <span class="daily-btn-meta" id="daily-best-label">Сегодня · —</span>
        </button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="score-box" id="score-box">
        <span class="label">Счёт</span>
        <span id="score">0</span>
        <span id="combo-label" class="combo-label is-off">Серия ×1</span>
      </div>
      <button id="pause-btn" class="restart-btn" type="button" aria-label="Пауза" title="Пауза">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
      </button>
      <div class="score-box" id="best-box">
        <span class="label" id="side-label">Рекорд</span>
        <span id="side-value">0</span>
      </div>
    </header>

    <main class="board-wrap" id="board-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div id="float-layer" class="float-layer" aria-hidden="true"></div>
    </main>

    <section class="tray" id="tray" aria-label="Фигуры"></section>
    <div class="bottom-space" aria-hidden="true"></div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="modal settings-modal">
      <h1>Настройки</h1>
      <div class="icon-row" role="group" aria-label="Параметры">
        <button id="settings-sound-btn" type="button" class="icon-btn" aria-label="Звук" title="Звук">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
        </button>
        <button id="settings-vibro-btn" type="button" class="icon-btn" aria-label="Вибрация" title="Вибрация">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/><path d="m2 2 20 20"/></svg>
        </button>
        <button id="settings-close-btn" type="button" class="icon-btn" aria-label="Закрыть" title="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="modal pause-modal">
      <h1>Пауза</h1>
      <p id="pause-meta" class="modal-sub">Классика</p>
      <div class="pause-actions" role="group" aria-label="Пауза">
        <button id="resume-btn" type="button" class="btn-primary">Продолжить</button>
        <button id="pause-restart-btn" type="button" class="btn-secondary">Рестарт</button>
        <button id="pause-menu-btn" type="button" class="btn-secondary">В меню</button>
      </div>
    </div>
  </div>

  <div id="revive-overlay" class="overlay revive-overlay hidden">
    <div class="revive-panel">
      <div class="revive-ring" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle class="revive-ring-bg" cx="60" cy="60" r="52" />
          <circle class="revive-ring-fg" id="revive-ring-fg" cx="60" cy="60" r="52" />
        </svg>
        <span class="revive-ring-count" id="revive-timer">5</span>
      </div>
      <p class="revive-caption">Можно продолжить</p>
      <button id="revive-btn" type="button" class="revive-btn">
        <span class="revive-btn-title">Возрождение</span>
      </button>
      <button id="revive-skip-btn" type="button" class="revive-skip">Пропустить</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <div id="new-record-badge" class="new-record hidden">Новый рекорд!</div>
      <div id="daily-record-badge" class="new-record new-record--daily hidden">Рекорд дня!</div>
      <h1 id="gameover-title">Конец игры</h1>
      <div class="modal-stats">
        <div class="stat">
          <span class="ms-label">Счёт</span>
          <span id="final-score" class="ms-value">0</span>
        </div>
        <div class="stat">
          <span class="ms-label" id="final-side-label">Рекорд</span>
          <span id="final-best" class="ms-value">0</span>
        </div>
        <div id="final-streak-wrap" class="stat hidden">
          <span class="ms-label">Серия</span>
          <span id="final-streak" class="ms-value">0</span>
        </div>
      </div>
      <button id="restart" type="button" class="btn-primary">Ещё раз</button>
      <button id="to-menu" type="button" class="btn-secondary">В меню</button>
    </div>
  </div>

  <div id="achievements-overlay" class="overlay hidden">
    <div class="modal achievements-modal">
      <div class="achievements-head">
        <div class="achievements-head-text">
          <p class="achievements-eyebrow">Коллекция</p>
          <h1>Достижения</h1>
          <p id="achievements-count" class="achievements-count">0 / 9</p>
        </div>
        <button id="achievements-close-btn" type="button" class="icon-btn icon-btn--sm" aria-label="Закрыть" title="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="achievements-list" class="achievements-list"></div>
    </div>
  </div>

  <div id="ach-toast" class="ach-toast hidden" role="status" aria-live="polite">
    <div class="ach-toast-inner">
      <span class="ach-toast-eyebrow">Достижение</span>
      <span class="ach-toast-title" id="ach-toast-title"></span>
    </div>
  </div>

  <script src="game.js?v=1.5.1"></script>
</body>
</html>
