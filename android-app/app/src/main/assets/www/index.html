<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grid Crush</title>
  <link rel="stylesheet" href="style.css?v=1.1.0" />
</head>
<body>
  <div id="menu" class="menu">
    <button type="button" id="settings-btn" class="icon-btn icon-btn--corner" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <div class="menu-inner">
      <header class="menu-hero">
        <h1 class="menu-title">Grid Crush</h1>
        <div class="menu-mini-grid" aria-hidden="true">
          <span class="menu-block" style="--c:#4aa3ff"></span>
          <span class="menu-block" style="--c:#57d38c"></span>
          <span class="menu-block" style="--c:#ffb454"></span>
          <span class="menu-block" style="--c:#ff6b8a"></span>
          <span class="menu-block" style="--c:#b388ff"></span>
          <span class="menu-block" style="--c:#ff8f5a"></span>
        </div>
        <p class="menu-record">Рекорд · <span data-best="classic">—</span></p>
      </header>

      <div class="menu-actions">
        <button type="button" id="play-btn" class="play-btn">Играть</button>
        <button type="button" id="continue-btn" class="continue-btn hidden">Продолжить</button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="score-box" id="score-box">
        <span class="label">Счёт</span>
        <span id="score">0</span>
        <span id="combo-label" class="combo-label is-off">Серия ×1</span>
      </div>
      <button id="pause-btn" class="restart-btn" type="button" aria-label="Пауза" title="Пауза">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
      </button>
      <div class="score-box" id="best-box">
        <span class="label" id="side-label">Рекорд</span>
        <span id="side-value">0</span>
      </div>
    </header>

    <main class="board-wrap" id="board-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div id="float-layer" class="float-layer" aria-hidden="true"></div>
    </main>

    <section class="tray" id="tray" aria-label="Фигуры"></section>
    <div class="bottom-space" aria-hidden="true"></div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="modal settings-modal">
      <h1>Настройки</h1>
      <div class="icon-row" role="group" aria-label="Параметры">
        <button id="settings-sound-btn" type="button" class="icon-btn" aria-label="Звук" title="Звук">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
        </button>
        <button id="settings-vibro-btn" type="button" class="icon-btn" aria-label="Вибрация" title="Вибрация">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/><path d="m2 2 20 20"/></svg>
        </button>
        <button id="settings-theme-btn" type="button" class="icon-btn" aria-label="Тема" title="Тема">
          <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
          <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button id="settings-close-btn" type="button" class="icon-btn" aria-label="Закрыть" title="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="modal pause-modal">
      <h1>Пауза</h1>
      <p id="pause-meta" class="modal-sub">Классика</p>
      <div class="icon-row" role="group" aria-label="Пауза">
        <button id="resume-btn" type="button" class="icon-btn" aria-label="Продолжить" title="Продолжить">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        </button>
        <button id="pause-restart-btn" type="button" class="icon-btn" aria-label="Заново" title="Заново">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="pause-menu-btn" type="button" class="icon-btn" aria-label="В меню" title="В меню">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <div id="new-record-badge" class="new-record hidden">Новый рекорд!</div>
      <h1 id="gameover-title">Конец игры</h1>
      <div class="modal-stats">
        <div class="stat">
          <span class="ms-label">Счёт</span>
          <span id="final-score" class="ms-value">0</span>
        </div>
        <div class="stat">
          <span class="ms-label" id="final-side-label">Рекорд</span>
          <span id="final-best" class="ms-value">0</span>
        </div>
        <div id="final-streak-wrap" class="stat hidden">
          <span class="ms-label">Лучшая серия</span>
          <span id="final-streak" class="ms-value">0</span>
        </div>
      </div>
      <button id="restart" type="button">Ещё раз</button>
      <button id="to-menu" type="button" class="btn-secondary">В меню</button>
    </div>
  </div>

  <script src="game.js?v=1.1.0"></script>
</body>
</html>
